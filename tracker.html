<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuantProf Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f0f13; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #2a2a33; position: sticky; top: 0; background: #0f0f13; z-index: 10;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  #userEmail { color: #9a9aa5; font-size: 0.85rem; margin-right: 12px; }
  button#logout {
    background: none; border: 1px solid #33333d; color: #cfcfd6; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  button#logout:hover { border-color: #7c5cff; color: #fff; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px; align-items: center;
    border-bottom: 1px solid #2a2a33;
  }
  .controls select, .controls input {
    background: #17171d; border: 1px solid #33333d; color: #fff; padding: 7px 10px;
    border-radius: 8px; font-size: 0.85rem;
  }
  .stat { font-size: 0.85rem; color: #9a9aa5; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: #7a7a85; padding: 10px 24px; border-bottom: 1px solid #2a2a33;
  }
  tbody tr { border-bottom: 1px solid #1e1e25; }
  tbody tr:hover { background: #16161c; }
  tbody td { padding: 12px 24px; font-size: 0.9rem; vertical-align: middle; }
  .num { color: #7a7a85; width: 40px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
  }
  .cat-probability { background: rgba(168,85,247,0.15); color: #c084fc; }
  .cat-brainteasers { background: rgba(251,146,60,0.15); color: #fb923c; }
  .cat-combinatorics { background: rgba(236,72,153,0.15); color: #f472b6; }
  .cat-default { background: rgba(148,163,184,0.15); color: #94a3b8; }
  .companies { color: #9a9aa5; font-size: 0.8rem; }
  .locked { opacity: 0.45; font-style: italic; }
  input[type=checkbox] {
    width: 20px; height: 20px; accent-color: #4ade80; cursor: pointer;
  }
  #loadingMsg { padding: 40px 24px; color: #9a9aa5; text-align: center; }

  .pagination {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    align-items: center; padding: 24px; border-top: 1px solid #2a2a33;
  }
  .pagination button {
    min-width: 36px; height: 36px; padding: 0 8px; border-radius: 8px;
    border: 1px solid #33333d; background: #17171d; color: #cfcfd6;
    cursor: pointer; font-size: 0.85rem;
  }
  .pagination button:hover:not(:disabled) { border-color: #7c5cff; color: #fff; }
  .pagination button.active { background: #7c5cff; border-color: #7c5cff; color: #fff; }
  .pagination button:disabled { opacity: 0.35; cursor: default; }
  .pagination .ellipsis { color: #7a7a85; padding: 0 4px; }
</style>
</head>
<body>
  <header>
    <h1>QuantProf Tracker</h1>
    <div style="display:flex; align-items:center;">
      <span id="userEmail"></span>
      <button id="logout">Log out</button>
    </div>
  </header>

  <div class="controls">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="solved">Solved</option>
      <option value="unsolved">Unsolved</option>
    </select>
    <select id="difficultyFilter">
      <option value="">All levels</option>
    </select>
    <select id="sortBy">
      <option value="id">Sort: # (default)</option>
      <option value="difficulty_asc">Sort: Level (low → high)</option>
      <option value="difficulty_desc">Sort: Level (high → low)</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search title..." />
    <span class="stat" id="statCount"></span>
  </div>

  <div id="loadingMsg">Loading questions...</div>

  <table id="questionTable" style="display:none;">
    <thead>
      <tr>
        <th class="num">#</th>
        <th>Title</th>
        <th>Category</th>
        <th>Difficulty</th>
        <th>Companies</th>
        <th>Solved</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="pagination" id="pagination" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    let currentUser = null;
    let questions = [];
    let progressMap = {}; // question_id -> solved boolean
    const PAGE_SIZE = 20;
    let currentPage = 1;

    function difficultyNum(d) {
      // "7/10" -> 7. Anything unparseable sorts last.
      if (!d) return -1;
      const n = parseInt(String(d).split("/")[0], 10);
      return isNaN(n) ? -1 : n;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "index.html"; return; }
      currentUser = session.user;
      document.getElementById("userEmail").textContent = currentUser.email;

      document.getElementById("logout").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
      });

      async function fetchAllQuestions() {
        let all = [];
        let from = 0;
        const batchSize = 1000;
        while (true) {
          const { data, error } = await supabaseClient
            .from("questions")
            .select("*")
            .order("id")
            .range(from, from + batchSize - 1);
          if (error) throw error;
          all = all.concat(data || []);
          if (!data || data.length < batchSize) break;
          from += batchSize;
        }
        return all;
      }

      let qData, qErr, pData, pErr;
      try {
        qData = await fetchAllQuestions();
      } catch (e) {
        qErr = e;
      }
      ({ data: pData, error: pErr } = await supabaseClient.from("progress").select("*").eq("user_id", currentUser.id));

      if (qErr) { document.getElementById("loadingMsg").textContent = "Error loading questions: " + qErr.message; return; }
      questions = qData || [];
      (pData || []).forEach(row => { progressMap[row.question_id] = row.solved; });

      populateCategoryFilter();
      populateDifficultyFilter();
      renderTable();

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("questionTable").style.display = "table";

      const resetAndRender = () => { currentPage = 1; renderTable(); };
      document.getElementById("categoryFilter").addEventListener("change", resetAndRender);
      document.getElementById("statusFilter").addEventListener("change", resetAndRender);
      document.getElementById("difficultyFilter").addEventListener("change", resetAndRender);
      document.getElementById("sortBy").addEventListener("change", resetAndRender);
      document.getElementById("searchBox").addEventListener("input", resetAndRender);
    }

    function populateCategoryFilter() {
      const cats = [...new Set(questions.map(q => q.category).filter(Boolean))].sort();
      const sel = document.getElementById("categoryFilter");
      cats.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    function populateDifficultyFilter() {
      const levels = [...new Set(questions.map(q => difficultyNum(q.difficulty)).filter(n => n >= 0))]
        .sort((a, b) => a - b);
      const sel = document.getElementById("difficultyFilter");
      levels.forEach(n => {
        const opt = document.createElement("option");
        opt.value = String(n); opt.textContent = `Level ${n}`;
        sel.appendChild(opt);
      });
    }

    function renderTable() {
      const catFilter = document.getElementById("categoryFilter").value;
      const statusFilter = document.getElementById("statusFilter").value;
      const difficultyFilter = document.getElementById("difficultyFilter").value;
      const sortBy = document.getElementById("sortBy").value;
      const search = document.getElementById("searchBox").value.toLowerCase();

      const solvedCount = questions.filter(q => !!progressMap[q.id]).length;

      // Filter
      let filtered = questions.filter(q => {
        const solved = !!progressMap[q.id];
        if (catFilter && q.category !== catFilter) return false;
        if (statusFilter === "solved" && !solved) return false;
        if (statusFilter === "unsolved" && solved) return false;
        if (difficultyFilter !== "" && difficultyNum(q.difficulty) !== parseInt(difficultyFilter, 10)) return false;
        if (search && !q.title.toLowerCase().includes(search)) return false;
        return true;
      });

      // Sort
      if (sortBy === "difficulty_asc") {
        filtered.sort((a, b) => difficultyNum(a.difficulty) - difficultyNum(b.difficulty));
      } else if (sortBy === "difficulty_desc") {
        filtered.sort((a, b) => difficultyNum(b.difficulty) - difficultyNum(a.difficulty));
      } else {
        filtered.sort((a, b) => a.id - b.id);
      }

      // Paginate
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      pageItems.forEach(q => {
        const solved = !!progressMap[q.id];
        const tr = document.createElement("tr");
        const catClass = q.category ? `cat-${q.category}` : "cat-default";
        const companies = (q.companies || []).join(", ");

        tr.innerHTML = `
          <td class="num">${q.id}</td>
          <td>${q.title}</td>
          <td><span class="badge ${catClass}">${q.category || "-"}</span></td>
          <td>${q.difficulty || "-"}</td>
          <td class="companies">${companies}</td>
          <td><input type="checkbox" data-qid="${q.id}" ${solved ? "checked" : ""} /></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("statCount").textContent =
        `${solvedCount} / ${questions.length} solved — ${filtered.length} match filters`;

      tbody.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", onToggle);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById("pagination");
      if (totalPages <= 1) { el.style.display = "none"; return; }
      el.style.display = "flex";
      el.innerHTML = "";

      function makeBtn(label, page, opts = {}) {
        const b = document.createElement("button");
        b.textContent = label;
        if (opts.active) b.classList.add("active");
        if (opts.disabled) b.disabled = true;
        b.addEventListener("click", () => { currentPage = page; renderTable(); window.scrollTo({top:0, behavior:"smooth"}); });
        return b;
      }

      el.appendChild(makeBtn("‹ Prev", currentPage - 1, { disabled: currentPage === 1 }));

      // Page numbers with ellipsis for long lists (like the real QP site)
      const pages = [];
      const windowSize = 1;
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= windowSize) {
          pages.push(p);
        } else if (pages[pages.length - 1] !== "...") {
          pages.push("...");
        }
      }
      pages.forEach(p => {
        if (p === "...") {
          const span = document.createElement("span");
          span.className = "ellipsis";
          span.textContent = "...";
          el.appendChild(span);
        } else {
          el.appendChild(makeBtn(String(p), p, { active: p === currentPage }));
        }
      });

      el.appendChild(makeBtn("Next ›", currentPage + 1, { disabled: currentPage === totalPages }));
    }

    async function onToggle(e) {
      const qid = parseInt(e.target.dataset.qid, 10);
      const solved = e.target.checked;
      progressMap[qid] = solved;

      const { error } = await supabaseClient.from("progress").upsert({
        user_id: currentUser.id,
        question_id: qid,
        solved,
        updated_at: new Date().toISOString()
      });

      if (error) {
        alert("Couldn't save: " + error.message);
        e.target.checked = !solved;
        progressMap[qid] = !solved;
        return;
      }
      renderTable();
    }

    init();
  </script>
</body>
</html>
